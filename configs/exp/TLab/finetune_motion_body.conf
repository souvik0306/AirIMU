general:
{
   exp_dir: experiments/tlab_finetune
}

dataset:
{
   include "../../datasets/TLab/tlab_body.conf"
   collate: padding9
}

train:
{
   pretrained_ckpt: /content/Air-IO/AirIO_EuRoC/AirIO_checkpoint/best_model.ckpt 
   lr: 3e-5                       // smaller steps improve fine-tuning stability but can slow convergence
   batch_size: 32                 // larger batch is smoother/less noisy gradients but uses more memory

   rot_weight: 1e3                // increases emphasis on rotation accuracy in total loss
   pos_weight: 1e2                // increases emphasis on position accuracy
   vel_weight: 1e1                // increases emphasis on velocity accuracy
   cov_weight: 1e-4               // scales covariance regularization effect

   network: codenet               // selects model architecture
   gtrot:True                     // uses ground-truth rotation during integration; usually stabilizes training
   propcov:True                   // enables covariance propagation branch and related outputs/loss terms
   covaug:True                    // lets covariance loss backprop through state errors (stronger coupling)
   
   sampling: 50                    // computes training signal at fixed stride/chunk endpoints; trades detail for speed
   loss: Huber_loss005             // translation/velocity robust loss; reduces outlier sensitivity
   rotloss: Huber_loss005          // rotation robust loss; limits outlier influence in orientation

   min_lr: 5e-7                     // floor for LR scheduler; prevents LR decaying to zero
   max_epoches: 30                  // hard cap on training duration
   patience: 6                      // epochs without improvement before LR is reduced / early-stop logic triggers
   factor: 0.5                      // LR decay multiplier when scheduler steps
   weight_decay: 5e-6               // L2 regularization; helps reduce overfitting

   save_freq: 5                     // checkpoint interval; safer recovery but more disk I/O
   eval_freq: 1                     // validation interval; tighter monitoring but higher runtime cost
}