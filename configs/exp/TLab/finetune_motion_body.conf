general:
{
   exp_dir: experiments/tlab_stage1
}

dataset:
{
   include "../../datasets/TLab/tlab_body.conf"
   collate: padding9
}

train:
{
   pretrained_ckpt: ./AirIMU_EuRoC/best_model.ckpt 
   lr: 3e-5
   batch_size: 64

   rot_weight: 1e3
   pos_weight: 1e2
   vel_weight: 3e1
   cov_weight: 1e-4

   network: codenet
   gtrot:True
   propcov:False
   covaug:False
   gtinit: True
   
   sampling: 50
   loss: Huber_loss005
   rotloss: Huber_loss005

   min_lr: 1e-6
   max_epoches: 30
   patience: 8
   factor: 0.5
   weight_decay: 1e-4

   save_freq: 5
   eval_freq: 1
}