# Run label: 4th_Nov_Scratch. Train IMU corrections from random initialization.
dataset:
{
   include "../../datasets/TLab/tlab_body.conf"
   collate: padding9
}

train:
{
   pretrained_ckpt: "none"
   lr: 3e-5
   batch_size: 128
   num_workers: 4
   pin_memory: True
   prefetch_factor: 2
   persistent_workers: True

   rot_weight: 1e3
   pos_weight: 1e2
   vel_weight: 3e1
   cov_weight: 1e-4

   network: codenet
   # Ground truth is used only for the initial state. Corrected gyro drives
   # every subsequent Stage 1 orientation update.
   gtrot: False
   # Construct a covariance-capable preintegrator. The training loop disables
   # covariance for epochs 1-8, then enables it with the scheduled loss weight.
   propcov: True
   covaug: False
   gtinit: True

   sampling: 50
   loss: Huber_loss005
   rotloss: Huber_loss005

   min_lr: 1e-6
   max_epoches: 25
   patience: 8
   factor: 0.5
   weight_decay: 1e-4

   save_freq: 5
   eval_freq: 1
}
