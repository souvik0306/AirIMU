general:
{
   exp_dir: experiments/tlab_stage2_4th_Nov
}

dataset:
{
   include "../../datasets/TLab/tlab_body.conf"
   collate: padding9
}

train:
{
   pretrained_ckpt: experiments/tlab_stage1_4th_Nov/finetune_motion_body/ckpt/best_model.ckpt

   lr: 1e-5
   batch_size: 128
   num_workers: 8
   pin_memory: True
   prefetch_factor: 2
   persistent_workers: True
   # Enable only when debugging a failing backward pass.
   detect_anomaly: False
   log_interval: 10

   rot_weight: 1e3
   pos_weight: 1e2
   vel_weight: 3e2
   cov_weight: 1e-4
   # Rotation NLL is almost entirely gyro-driven; weight it above vel/pos.
   rot_cov_weight: 3e-4
   vel_cov_weight: 1e-4
   pos_cov_weight: 1e-4
   # Direct pull toward lower raw acc/gyro variance, on top of the NLL term.
   # Drone velocity performance is more gyro-sensitive, so gyro is pulled harder.
   acc_cov_reg_weight: 1e-3
   gyro_cov_reg_weight: 3e-3

   network: codenet
   gtrot: True
   propcov: True
   covaug: True
   gtinit: True

   # Hard ceiling on predicted variance (sigmoid-bounded in CodeNet.cov_decoder):
   # never exceeds the original datasheet noise (std 0.35 accel, 0.015 gyro),
   # squared. Floors are the sensor's noise-density minimum (std 0.01 accel,
   # 0.0001 gyro), squared.
   acc_cov_min: 1.0e-4
   acc_cov_max: 1.225e-1
   gyro_cov_min: 1.0e-8
   gyro_cov_max: 2.25e-4

   # Desired operating point (std 0.07 accel, 0.003 gyro = 1/5 of datasheet
   # noise), squared. Only seeds initialization and anchors the reg loss below
   # — the model can still use the full range up to cov_max when data demands it.
   # (init fraction is derived automatically from this target; set
   # acc_cov_init_fraction/gyro_cov_init_fraction explicitly to override.)
   acc_cov_target: 4.9e-3
   gyro_cov_target: 9.0e-6

   sampling: 10
   loss: Huber_loss005
   rotloss: Huber_loss005

   min_lr: 1e-6
   max_epoches: 30
   patience: 10
   factor: 0.5
   weight_decay: 1e-4

   # Read best_loss (the best Stage 1 validation velocity RMSE) directly from
   # pretrained_ckpt so a fresh two-stage PBS run needs no manual update.
   stage1_vel_ref: auto
   vel_degradation_limit: 0.05
   stage: 2

   save_freq: 5
   eval_freq: 1
}
