dataset:
{
   include "../../datasets/TLab/tlab_body.conf"
   collate: padding9
}

train:
{
   lr: 1e-5
   batch_size: 128
   num_workers: 8
   pin_memory: True
   prefetch_factor: 2
   persistent_workers: True
   # Enable only when debugging a failing backward pass.
   detect_anomaly: False
   log_interval: 10

   # Corrected trajectory losses are logged but excluded from the Stage 2
   # objective. Train the uncertainty heads with the full raw-IMU covariance
   # NLL (rotation, velocity, position and their cross-correlations).
   rot_weight: 2e2
   pos_weight: 1e2
   vel_weight: 3e2
   cov_weight: 1.0
   acc_cov_reg_weight: 0.0
   gyro_cov_reg_weight: 0.0

   network: codenet
   gtrot: True
   propcov: True
   covaug: False
   gtinit: True

   # Stage 2 starts at a one-second raw-IMU integration horizon. At 200 Hz
   # this is 200 samples; integration_window_seconds may be raised to 2.0
   # (400 samples) without editing the dataset split files.
   imu_rate_hz: 200
   integration_window_seconds: 1.0

   # Use the fixed EKF2 estimate from the matching flight. It is subtracted
   # only in the Stage 2 raw-integration target; the CNN-GRU still sees raw IMU.
   use_initial_sensor_bias: True
   initial_sensor_bias_root: ./initial_sensor_biases

   # softplus(raw) + epsilon guarantees positive variance for stable NLL and
   # Cholesky operations without imposing a hard upper bound.
   covariance_epsilon: 1.0e-6

   # Desired operating point (std 0.07 accel, 0.003 gyro = 1/5 of datasheet
   # noise), squared. These values only seed uncertainty-head initialization;
   # Stage 2 then uses covariance NLL alone and may learn larger variances.
   acc_cov_target: 4.9e-3
   gyro_cov_target: 9.0e-6

   # False applies the covariance NLL at the end of the complete 1--2 second
   # window instead of resetting/supervising at short sub-window intervals.
   sampling: False
   loss: Huber_loss005
   rotloss: Huber_loss005

   min_lr: 1e-6
   max_epoches: 45
   patience: 10
   factor: 0.5
   weight_decay: 1e-4

   # Record the best Stage 1 validation velocity RMSE from the checkpoint for
   # provenance and monitoring. It is not part of the Stage 2 objective.
   stage1_vel_ref: auto
   stage: 2

   save_freq: 5
   eval_freq: 1
}
