general:
{
   exp_dir: experiments/tlab_stage2_3rd_Nov
}

dataset:
{
   include "../../datasets/TLab/tlab_body.conf"
   collate: padding9
}

train:
{
   pretrained_ckpt: experiments/tlab_stage1_3rd_Nov/finetune_motion_body/ckpt/best_model.ckpt

   lr: 1e-5
   batch_size: 128
   num_workers: 8
   pin_memory: True
   prefetch_factor: 2
   persistent_workers: True

   rot_weight: 1e3
   pos_weight: 1e2
   vel_weight: 3e2
   cov_weight: 1e-4

   network: codenet
   gtrot: True
   propcov: True
   covaug: True
   gtinit: True

   sampling: 10
   loss: Huber_loss005
   rotloss: Huber_loss005

   min_lr: 1e-6
   max_epoches: 30
   patience: 10
   factor: 0.5
   weight_decay: 1e-4

   # Read best_loss (the best Stage 1 validation velocity RMSE) directly from
   # pretrained_ckpt so a fresh two-stage PBS run needs no manual update.
   stage1_vel_ref: auto
   vel_degradation_limit: 0.05
   stage: 2

   save_freq: 5
   eval_freq: 1
}
