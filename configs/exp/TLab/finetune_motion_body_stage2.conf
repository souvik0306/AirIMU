dataset:
{
   include "../../datasets/TLab/tlab_body.conf"
   collate: padding9
}

train:
{
   lr: 1e-5
   batch_size: 128
   num_workers: 8
   pin_memory: True
   prefetch_factor: 2
   persistent_workers: True
   # Enable only when debugging a failing backward pass.
   detect_anomaly: False
   log_interval: 10

   rot_weight: 1e2
   pos_weight: 1e1
   vel_weight: 3e1
   # One joint rotation/velocity/position NLL using the full 9x9 covariance.
   # Marginal 3x3 NLLs are logged as diagnostics, without separate weights.
   cov_weight: 1e-4
   # Direct pull toward lower raw acc/gyro variance, on top of the NLL term.
   # Drone velocity performance is more gyro-sensitive, so gyro is pulled harder.
   acc_cov_reg_weight: 1e-3
   gyro_cov_reg_weight: 3e-3

   network: codenet
   gtrot: True
   propcov: True
   covaug: True
   gtinit: True

   # Subtract the flight's fixed EKF2 bias only for Stage 2 covariance
   # supervision when True; False uses unmodified raw IMU for that target.
   # The network continues to consume the original raw IMU in either case.
   use_initial_sensor_bias: True
   initial_sensor_bias_root: ./initial_sensor_biases

   # Positive softplus variances with minimum floors and no upper limits.
   use_cov_limits: False
   acc_cov_min: 1.0e-4
   gyro_cov_min: 1.0e-8

   # Output scales and normalization for the existing variance penalty.
   # These scales do not force initial predictions; heads initialize randomly.
   acc_cov_target: 4.9e-3
   gyro_cov_target: 9.0e-6

   sampling: 10
   loss: Huber_loss005
   rotloss: Huber_loss005

   min_lr: 1e-6
   max_epoches: 30
   patience: 10
   factor: 0.5
   weight_decay: 1e-4

   # Read best_loss (the best Stage 1 validation velocity RMSE) directly from
   # the Stage 1 checkpoint supplied with --pretrained_ckpt.
   stage1_vel_ref: auto
   vel_degradation_limit: 0.05
   stage: 2

   save_freq: 5
   eval_freq: 1
}
