# Compare with finetune_motion_body_stage2.conf using the same Stage 1
# checkpoint, split, seed, epochs, raw integration and joint 9x9 NLL.
include "finetune_motion_body_stage2.conf"
dataset.collate: padding9_raw
train {
   raw_cov_adapter: True
   adapter_finetune_heads: False
   adapter_head_lr: 1e-6
   gradient_clip: 1.0
   # Match the uncapped Stage 1 decoder's output policy exactly.
   use_cov_limits: False
   gtrot: False
   # Calibration comes from joint NLL; no arbitrary variance target penalty.
   acc_cov_reg_weight: 0.0
   gyro_cov_reg_weight: 0.0
}
